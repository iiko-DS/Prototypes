<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Добавление типа фасовки — прототип ДС</title>
<!-- ДС: токены + стили компонентов (по URL сайта ДС) -->
<link rel="stylesheet" href="https://anders7rusk.github.io/iiko-ds-web/tokens.css">
<link rel="stylesheet" href="https://anders7rusk.github.io/iiko-ds-web/components/index.css">
<!-- Roboto из Google Fonts -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<!-- Иконки Material Icons -->
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
  /* каркас страницы (свой лейаут — у него нет ДС-компонента) */
  html,body{margin:0;min-height:100%;background:#f4f5f7;font-family:'Roboto','Helvetica Neue',Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh}
  .layout{width:var(--ds-dialog-width, 500px);max-width:calc(100vw - 32px)}
  /* попап: подрезать детей под скругление (иначе квадратные углы) */
  .ds-dialog-view{overflow:hidden}
  /* шапка: заголовок слева, крестик справа; отступы — из токенов */
  .dlgh{display:flex;align-items:center;justify-content:space-between;width:100%;padding:var(--ds-space-5x) var(--ds-space-6x) var(--ds-space-3x);box-sizing:border-box}
  /* раскладка формы внутри __scroll: растянуться + колонка; отступы — из токенов */
  .ds-dialog-content__scroll{flex:1 1 auto;width:100%;padding:var(--ds-space-4x) var(--ds-space-6x);gap:var(--ds-space-3x);box-sizing:border-box}
  /* подвал: кнопки действий — выравнивание и зазор; отступы/gap — из токенов */
  .dlg-actions{display:flex;justify-content:flex-end;align-items:center;gap:var(--ds-space-2x);padding:var(--ds-space-4x) var(--ds-space-6x)}
</style>
</head>
<body>
<div class="layout">

  <!-- Попап: ds-dialog-view (основа окна) -->
  <div class="ds-dialog-view">

    <!-- Шапка: title-container (flex-row) — заголовок слева, крестик справа -->
    <div class="ds-dialog-header ds-dialog-header--text">
      <div class="ds-dialog-header__title-container dlgh">
        <span class="ds-dialog-header__label">Добавление типа фасовки</span>
        <span class="ds-dialog-header__icon"><span class="material-icons">close</span></span>
      </div>
    </div>

    <!-- Содержимое -->
    <div class="ds-dialog-content">
      <div class="ds-dialog-content__scroll">

        <!-- Инфо-сообщение -->
        <div class="ds-banner ds-banner--accent ds-banner--horizontal">
          <span class="ds-banner__row">
            <span class="ds-banner__icon"><span class="material-icons">info</span></span>
            <span class="ds-banner__text">Базовая единица товара «Картофель фри»: кг.</span>
          </span>
        </div>

        <!-- Поле «Название фасовки *» -->
        <div class="ds-input ds-input--m">
          <div class="ds-input__frame">
            <div class="ds-input__content">
              <label class="ds-input__label">Название фасовки *</label>
              <input class="ds-input__field" type="text" value="упаковка 2 кг">
            </div>
          </div>
        </div>

        <!-- Поле «Количество базовых единиц в фасовке *» -->
        <div class="ds-input ds-input--m">
          <div class="ds-input__frame">
            <div class="ds-input__content">
              <label class="ds-input__label">Количество базовых единиц в фасовке *</label>
              <input class="ds-input__field" type="text" placeholder="">
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Подвал: кнопки действий (главное — справа, отмена — слева от него) -->
    <div class="ds-dialog-footer">
      <div class="dlg-actions">
        <button class="ds-btn ds-btn--m ds-btn--neutral ds-btn--outlined" type="button">
          <span class="ds-btn__label">Отменить</span>
        </button>
        <button class="ds-btn ds-btn--m ds-btn--accent ds-btn--filled" type="button">
          <span class="ds-btn__label">Добавить и выбрать</span>
        </button>
      </div>
    </div>

  </div>
</div>
</body>
</html>
