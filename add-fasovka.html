<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Добавление типа фасовки — прототип ДС</title>
<!-- ДС: токены + стили компонентов -->
<link rel="stylesheet" href="https://anders7rusk.github.io/iiko-ds-web/tokens.css">
<link rel="stylesheet" href="https://anders7rusk.github.io/iiko-ds-web/components/index.css">
<!-- Roboto из Google Fonts -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<!-- Иконки Material Icons -->
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
  /* каркас страницы (свой лейаут — у него нет ДС-компонента) */
  html,body{margin:0;min-height:100%;background:#f4f5f7;font-family:'Roboto','Helvetica Neue',Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh}
  .layout{width:500px;max-width:calc(100vw - 32px)}
</style>
</head>
<body>
<div class="layout">

  <!-- ═══ Попап «Добавление типа фасовки» ═══ -->
  <div class="ds-dialog-view">

    <!-- Шапка: заголовок + крестик -->
    <div class="ds-dialog-header ds-dialog-header--text">
      <span class="ds-dialog-header__title-container">
        <span class="ds-dialog-header__label">Добавление типа фасовки</span>
      </span>
      <span class="ds-dialog-header__icon"><span class="material-icons">close</span></span>
    </div>

    <!-- Содержимое: инфо + форма -->
    <div class="ds-dialog-content">

      <!-- Инфо-сообщение (Banner, стиль Accent) -->
      <div class="ds-banner ds-banner--accent ds-banner--horizontal">
        <span class="ds-banner__row">
          <span class="ds-banner__icon"><span class="material-icons">info</span></span>
          <span class="ds-banner__text">Базовая единица товара «Картофель фри»: кг.</span>
        </span>
      </div>

      <!-- Поле «Название фасовки» (обязательное, заполнено) -->
      <div class="ds-input ds-input--m">
        <div class="ds-input__frame">
          <div class="ds-input__content">
            <label class="ds-input__label">Название фасовки *</label>
            <input class="ds-input__field" type="text" value="упаковка 2 кг">
          </div>
        </div>
      </div>

      <!-- Поле «Количество базовых единиц в фасовке» (обязательное, пустое) -->
      <div class="ds-input ds-input--m">
        <div class="ds-input__frame">
          <div class="ds-input__content">
            <label class="ds-input__label">Количество базовых единиц в фасовке *</label>
            <input class="ds-input__field" type="text">
          </div>
        </div>
      </div>

    </div>

    <!-- Подвал: кнопки -->
    <div class="ds-dialog-footer">
      <div class="ds-dialog-footer__button">
        <button class="ds-btn ds-btn--m ds-btn--neutral ds-btn--outlined" type="button">
          <span class="ds-btn__label">ОТМЕНИТЬ</span>
        </button>
      </div>
      <div class="ds-dialog-footer__button">
        <button class="ds-btn ds-btn--m ds-btn--accent ds-btn--filled" type="button">
          <span class="ds-btn__label">ДОБАВИТЬ И ВЫБРАТЬ</span>
        </button>
      </div>
    </div>

  </div>
</div>
</body>
</html>
