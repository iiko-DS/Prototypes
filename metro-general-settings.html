<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Общие настройки — «Метро» (прототип ДС)</title>
<!-- ДС: токены + стили компонентов (в соседней папке DS) -->
<link rel="stylesheet" href="../DS/components-web/tokens.css">
<link rel="stylesheet" href="../DS/components-web/styles.css">
<link rel="stylesheet" href="../DS/components-web/components/index.css">
<!-- fixes.css — ручной слой правок поверх генерации ДС; обновления из Фигмы его не перезаписывают -->
<link rel="stylesheet" href="../DS/components-web/fixes.css">
<!-- Roboto из Google Fonts -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<!-- Иконки Material Icons (конвенция существующих прототипов) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
  /* ── Каркас страницы ─────────────────────────────────────── */
  html,body{margin:0;min-height:100%;background:#f4f5f7;font-family:'Roboto','Helvetica Neue',Arial,sans-serif}
  body{display:flex;align-items:flex-start;justify-content:center;min-height:100vh;padding:24px;box-sizing:border-box}

  /* ── Приложение (каркас: topbar + body) ──────────────────── */
  .app{
    width:768px;max-width:calc(100vw - 32px);
    display:flex;flex-direction:column;
    background:#fff;border-radius:12px;overflow:hidden;
    box-shadow:0 3px 4px #9e9e9e33, 0 3px 3px #9e9e9e24, 0 1px 8px #9e9e9e33;
  }
  .app__body{display:flex;flex:1;background:#f4f5f7;min-height:576px}

  /* ── Top app bar (каркас, нет ДС-компонента) ─────────────── */
  .topbar{
    height:64px;display:flex;align-items:center;gap:8px;
    padding:0 8px 0 4px;background:#fff;
    border-bottom:1px solid var(--ds-color-stroke-default);
  }
  .topbar__left{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
  .topbar__logo{display:flex;align-items:center;margin:0 6px}
  .topbar__restaurant{
    display:inline-flex;align-items:center;gap:8px;height:36px;padding:8px 12px;
    border:none;background:none;border-radius:var(--ds-radius-2x);cursor:pointer;
    color:var(--ds-color-text-primary);font-family:inherit;
    font:var(--ds-font-body-m-16-normal-medium);white-space:nowrap;
  }
  .topbar__restaurant:hover{background:var(--ds-color-button-neutral-hover)}
  .topbar__restaurant .material-icons{font-size:20px;color:var(--ds-color-icon-primary)}
  .weekdays{display:flex;align-items:center}
  .weekdays__day{
    display:inline-flex;align-items:center;justify-content:center;
    width:28px;height:28px;border:none;background:none;border-radius:var(--ds-radius-circular);
    cursor:pointer;color:var(--ds-color-text-primary);
    font-family:inherit;font-size:var(--ds-typography-font-size-3-5x);
    font-weight:var(--ds-typography-font-weight-regular);line-height:20px;
  }
  .weekdays__day:hover{background:var(--ds-color-button-neutral-hover)}
  .weekdays__day--active{color:var(--ds-color-text-accent);font-weight:var(--ds-typography-font-weight-medium)}
  .topbar__right{display:flex;align-items:center;gap:2px}
  .topbar__date{
    display:inline-flex;align-items:center;gap:8px;height:36px;padding:8px 12px;
    border:none;background:none;border-radius:var(--ds-radius-2x);cursor:pointer;
    color:var(--ds-color-text-primary);font-family:inherit;white-space:nowrap;
  }
  .topbar__date:hover{background:var(--ds-color-button-neutral-hover)}
  .topbar__date .material-icons{font-size:20px;color:var(--ds-color-icon-primary)}

  /* ── Sidenav (свёрнутый рельс, 52px) ─────────────────────── */
  .app__sidenav{
    width:52px;flex-shrink:0;display:flex;flex-direction:column;
    background:var(--ds-color-sidenav-item-l1-background);   /* #263136 */
    color:var(--ds-color-sidenav-item-l1-text-color);        /* #ffffff */
    font-family:inherit;
  }
  .sidenav__header{padding:12px 14px 0;display:flex;flex-direction:column}
  .sidenav__control{
    min-height:41px;display:flex;align-items:center;justify-content:center;
    color:#fff;cursor:pointer;background:transparent;
  }
  .sidenav__control:hover{background:var(--ds-color-sidenav-item-l1-background-hover)}
  .sidenav__item{
    height:44px;display:flex;align-items:center;justify-content:center;
    color:#fff;cursor:pointer;position:relative;
    background:transparent;border:none;
    transition:background-color .12s ease;
  }
  .sidenav__item:hover{background:var(--ds-color-sidenav-item-l1-background-hover)}
  .sidenav__item--selected{background:var(--ds-color-sidenav-item-l1-background-selected)}
  .sidenav__item .material-icons{font-size:20px;color:#fff}
  .sidenav__badge{
    position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:9999px;
  }
  .sidenav__badge--accent{background:var(--ds-color-badge-accent-background)}
  .sidenav__badge--positive{background:var(--ds-color-badge-positive-background)}
  .sidenav__footer{
    margin-top:auto;border-top:1px solid rgba(255,255,255,.12);
    padding:8px 0;display:flex;flex-direction:column;
  }
  .sidenav__avatar{
    height:44px;display:flex;align-items:center;justify-content:center;
  }
  .sidenav__avatar-dot{
    width:28px;height:28px;border-radius:9999px;display:flex;align-items:center;justify-content:center;
    background:var(--ds-color-brand-accent-default);color:#fff;
    font-size:var(--ds-typography-font-size-3x);font-weight:var(--ds-typography-font-weight-medium);
  }

  /* ── Контент ─────────────────────────────────────────────── */
  .content{flex:1;min-width:0;display:flex;justify-content:center}
  .content__inner{width:652px;max-width:100%;padding:24px 32px 32px;display:flex;flex-direction:column}

  /* строка заголовка: назад + «Метро» + кнопка справа */
  .content__title-row{display:flex;align-items:center;gap:8px}
  .content__title{
    margin:0;flex:1;min-width:0;
    font:var(--ds-font-header-m-24-normal-medium);   /* 500 24/32 */
    color:var(--ds-color-text-primary);
  }
  .content__actions{display:flex;align-items:center}

  /* степпер */
  .content__stepper{margin-top:20px;overflow:hidden}
  .content__stepper .ds-stepper{width:100%}

  /* заголовок секции */
  .content__heading{
    margin:24px 0 8px;
    font:var(--ds-font-header-s-20-normal-medium);   /* 500 20/28 */
    color:var(--ds-color-text-primary);
  }

  /* карточка */
  .content__card .ds-card__content{gap:20px}

  /* низ: счётчик шагов + «Далее» (справа) */
  .content__footer{margin-top:24px;display:flex;justify-content:flex-end}
  .content__footer .ds-stepper-button{width:100%;justify-content:flex-end}

  /* textarea — заполнить рамку ДС */
  .ds-textarea__field{
    flex:1;width:100%;min-height:76px;box-sizing:border-box;
    border:none;outline:none;resize:none;background:transparent;
    font-family:inherit;font-size:var(--ds-font-body-m-16-normal-regular-size);
    line-height:24px;color:var(--ds-color-text-primary);padding:0;
  }
  .ds-textarea__field::placeholder{color:var(--ds-color-text-placeholder)}

  /* логотип iiko — вектор «и» (знак продукта) */
  .logo-iiko{display:inline-flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<div class="app">

  <!-- ═══ Top app bar ═══ -->
  <header class="topbar">
    <div class="topbar__left">
      <button class="ds-btn-icon ds-btn-icon--m ds-btn-icon--neutral ds-btn-icon--text" aria-label="Меню">
        <span class="ds-btn-icon__icon material-icons">menu</span>
      </button>
      <span class="topbar__logo logo-iiko" aria-label="iiko">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
          <path fill="#F5573B" d="M8.5 7h4.2v8.4L21 7h4.8v18H21.6v-8.4L12.7 25H8.5z"/>
        </svg>
      </span>
      <button class="topbar__restaurant" type="button">
        <span class="material-icons">storefront</span>
        SIT Restaurant&amp;Bar
        <span class="material-icons">arrow_drop_down</span>
      </button>
    </div>

    <div class="weekdays" aria-label="Дни недели">
      <button class="weekdays__day" type="button">Д</button>
      <button class="weekdays__day" type="button">Н</button>
      <button class="weekdays__day weekdays__day--active" type="button">М</button>
      <button class="weekdays__day" type="button">Г</button>
      <button class="weekdays__day" type="button">П</button>
    </div>

    <div class="topbar__right">
      <button class="ds-btn-icon ds-btn-icon--m ds-btn-icon--neutral ds-btn-icon--text" aria-label="Предыдущий период">
        <span class="ds-btn-icon__icon material-icons">chevron_left</span>
      </button>
      <button class="topbar__date" type="button">
        <span class="material-icons">calendar_today</span>
        Апр. 2024
        <span class="material-icons">arrow_drop_down</span>
      </button>
      <button class="ds-btn-icon ds-btn-icon--m ds-btn-icon--neutral ds-btn-icon--text" aria-label="Следующий период">
        <span class="ds-btn-icon__icon material-icons">chevron_right</span>
      </button>
    </div>
  </header>

  <div class="app__body">

    <!-- ═══ Sidenav (свёрнуто) ═══ -->
    <aside class="app__sidenav">
      <div class="sidenav__header">
        <span class="logo-iiko" aria-label="iiko">
          <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true">
            <path fill="#ffffff" d="M8.5 7h4.2v8.4L21 7h4.8v18H21.6v-8.4L12.7 25H8.5z"/>
          </svg>
        </span>
      </div>
      <div class="sidenav__control" title="Развернуть меню">
        <span class="material-icons">chevron_right</span>
      </div>

      <button class="sidenav__item" type="button" aria-label="Заказы"><span class="material-icons">receipt_long</span></button>
      <button class="sidenav__item" type="button" aria-label="Склады"><span class="material-icons">inventory_2</span></button>
      <button class="sidenav__item" type="button" aria-label="Отчёты"><span class="material-icons">insert_chart_outlined</span></button>
      <button class="sidenav__item" type="button" aria-label="Настройки"><span class="material-icons">settings</span></button>
      <button class="sidenav__item" type="button" aria-label="Сотрудники"><span class="material-icons">badge</span></button>
      <button class="sidenav__item" type="button" aria-label="Склад"><span class="material-icons">local_shipping</span></button>
      <button class="sidenav__item" type="button" aria-label="Помощь"><span class="material-icons">help_outline</span></button>

      <div class="sidenav__footer">
        <button class="sidenav__item" type="button" aria-label="Справка"><span class="material-icons">forum</span></button>
        <button class="sidenav__item" type="button" aria-label="Выход"><span class="material-icons">power_settings_new</span></button>
        <div class="sidenav__avatar">
          <span class="sidenav__avatar-dot">KK</span>
        </div>
      </div>
    </aside>

    <!-- ═══ Контент ═══ -->
    <main class="content">
      <div class="content__inner">

        <!-- Заголовок: назад + «Метро» + кнопка -->
        <div class="content__title-row">
          <button class="ds-btn-icon ds-btn-icon--m ds-btn-icon--neutral ds-btn-icon--text" aria-label="Назад">
            <span class="ds-btn-icon__icon material-icons">arrow_back</span>
          </button>
          <h1 class="content__title">Метро</h1>
          <div class="content__actions">
            <button class="ds-btn ds-btn--m ds-btn--neutral ds-btn--filled" type="button">
              <span class="ds-btn__icon material-icons">add</span>
              <span class="ds-btn__label">Button</span>
              <span class="ds-btn__icon material-icons">add</span>
            </button>
          </div>
        </div>

        <!-- Степпер: шаги мастера -->
        <div class="content__stepper">
          <div class="ds-stepper">
            <button class="ds-step ds-step--selected" type="button">
              <span class="ds-step__num">1</span><span>Общие настройки</span>
            </button>
            <span class="ds-stepper__divider"></span>
            <button class="ds-step" type="button">
              <span class="ds-step__num">2</span><span>Создание заказа</span>
            </button>
            <span class="ds-stepper__divider"></span>
            <button class="ds-step" type="button">
              <span class="ds-step__num">3</span><span>Подтверждение заказа</span>
            </button>
            <span class="ds-stepper__divider"></span>
            <button class="ds-step" type="button">
              <span class="ds-step__num">4</span><span>Отправка заказа</span>
            </button>
          </div>
        </div>

        <!-- Заголовок секции -->
        <h2 class="content__heading">Общие настройки</h2>

        <!-- Карточка с полями -->
        <div class="ds-card ds-card--outlined content__card">
          <div class="ds-card__content">

            <!-- Переключатель: Активный (выкл.) -->
            <label class="ds-slide-toggle">
              <span class="ds-slide-toggle__row">
                <input type="checkbox" class="ds-slide-toggle__input">
                <span class="ds-slide-toggle__track"></span>
                <span class="ds-slide-toggle__title">Активный</span>
              </span>
            </label>

            <!-- Поле: Название процесса -->
            <div class="ds-input ds-input--m">
              <div class="ds-input__frame">
                <div class="ds-input__content">
                  <input class="ds-input__field" type="text" placeholder="Название процесса">
                </div>
              </div>
            </div>

            <!-- Текстовое поле: Описание процесса -->
            <div class="ds-textarea ds-textarea--empty">
              <div class="ds-textarea__input-frame">
                <textarea class="ds-textarea__field" placeholder="Описание процесса"></textarea>
              </div>
            </div>

            <!-- Переключатель: Выбор поставщика в заказе (выкл.) -->
            <label class="ds-slide-toggle">
              <span class="ds-slide-toggle__row">
                <input type="checkbox" class="ds-slide-toggle__input">
                <span class="ds-slide-toggle__track"></span>
                <span class="ds-slide-toggle__title">Выбор поставщика в заказе</span>
              </span>
            </label>

            <!-- Поле со стрелкой: Выберите внешнего поставщика -->
            <div class="ds-input ds-input--m">
              <div class="ds-input__frame">
                <div class="ds-input__content">
                  <input class="ds-input__field" type="text" placeholder="Выберите внешнего поставщика">
                </div>
                <span class="ds-input__icon material-icons">arrow_drop_down</span>
              </div>
            </div>

          </div>
        </div>

        <!-- Низ: счётчик шагов + «Далее» -->
        <div class="content__footer">
          <div class="ds-stepper-button">
            <span class="ds-stepper-button__counter">1 из 6</span>
            <div class="ds-stepper-button__group">
              <button class="ds-btn ds-btn--m ds-btn--accent ds-btn--outlined" type="button">
                <span class="ds-btn__label">Далее</span>
                <span class="ds-btn__icon material-icons">add</span>
              </button>
            </div>
          </div>
        </div>

      </div>
    </main>

  </div>
</div>

</body>
</html>
