<!-- ШАБЛОН пробы для страниц-прототипов КДС.
     Как пользоваться: взять нужный прототип (multi-shop.html и т.п.), вставить этот блок
     перед </body>, заменить CLICKS и ЗАМЕРЫ. Записать пробу как отдельный файл
     (из execute_code/write_file, НЕ через heredoc в terminal) и запустить:

     chrome --headless --disable-gpu --no-first-run \
       --user-data-dir="$LOCALAPPDATA/Temp/chr-probe" \
       --virtual-time-budget=9000 --window-size=1600,1000 \
       --dump-dom "file:///<путь>/probe.html" > out.html

     Затем вытащить <pre id="probe">(.*?)</pre> регуляркой (маркер START в исходнике
     скрипта тоже найдётся — искать именно по <pre>).
     Состояние (что получилось после кликов) брать из дампа: скриншот может отражать
     состояние ДО кликов. -->
<script>
/* ── CLICKS: выполняются сразу, до load (чтобы состояние было «нажитым») ── */
(function(){
  function click(sel){ var el=document.querySelector(sel); if(el) el.click(); else console.log('нет '+sel); }
  click('#pageTabs [data-vtab="3"]');        /* переключить вкладку варианта */
  // click('[data-v3="arrow"]');              /* подвариант 3.1/3.2 */
  // click('#panels3 .panel[data-shop="cold"] [data-press="warm"]');  /* нажать блюдо в цехе */
})();
</script>

<pre id="probe"></pre>
<script>
window.addEventListener('load', function(){ setTimeout(function(){
  var out=[];
  function L(k,v){ out.push(k+': '+v); }
  function rect(el){ var r=el.getBoundingClientRect();
    return Math.round(r.width)+'x'+Math.round(r.height)+' @'+Math.round(r.left)+','+Math.round(r.top+window.scrollY); }
  function cs(el,p){ return el ? getComputedStyle(el)[p] : '—'; }
  /* строка нужного блюда — по тексту, а не по порядку */
  function rowByText(root, txt){
    return [].filter.call(document.querySelectorAll(root+' .kds-row, '+root+' .kdsx-row'),
      function(r){ return r.textContent.indexOf(txt)>=0; })[0];
  }

  try{
    /* ── ЗАМЕРЫ: геометрия, computed-стили, состояния ── */
    var row = rowByText('#panels3 .panel[data-shop="cold"]', 'Тёплый салат');
    L('строка', row ? '"'+row.className+'" '+rect(row)+' | кант '+cs(row,'boxShadow') : 'не найдена');
    var btn = document.querySelector('#panels3 .panel[data-shop="cold"] .pbtn');
    L('кнопка', btn ? '"'+btn.className+'" '+rect(btn)+' | числа '+cs(btn.querySelector('.pbtn__num'),'fontSize')
      +' | иконок '+btn.querySelectorAll('.material-icons').length : '—');
    /* интерактив: клик мышью не нужен, .click() достаточно — обработчики на document */
    var press = document.querySelector('#scrCard [data-press="warm"]');
    if(press){ press.click(); L('после нажатия', '"'+cs(press,'boxShadow')+'"'); }
    L('переполнение страницы', (document.documentElement.scrollWidth-document.documentElement.clientWidth)+' px');
    L('readyState', document.readyState);
  }catch(e){ L('ОШИБКА', e.message+' | '+(e.stack||'').split('\n')[1]); }

  document.getElementById('probe').textContent = 'START\n'+out.join('\n')+'\nEND';
}, 400); });
</script>
