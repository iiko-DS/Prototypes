<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family: 'Roboto', -apple-system, Arial, sans-serif; background:#d8d8d8; padding:48px 24px; }
  .container {
    display:flex; gap:48px; padding:32px; background:#f7f7f7;
    border:1px solid #d9d9d9; border-radius:16px; width:fit-content; margin:0 auto;
  }
  .col { width:400px; flex-shrink:0; display:flex; flex-direction:column; }
  .col-title { font-size:20px; font-weight:700; color:#1a1a1a; }
  .col-sub { font-size:12px; color:#808080; margin-top:2px; }
  .links { font-size:11px; font-weight:500; color:#007aff; margin-top:4px; }
  .links a { color:#007aff; text-decoration:underline; }
  .linkback { font-size:11px; color:#f7f7f7; margin-top:4px; }  /* невидимый spacer для выравнивания */
  .divider { height:1px; background:#d9d9d9; opacity:.5; margin:12px 0 6px; }
  .sec { font-size:10px; font-weight:700; color:#666; margin:8px 0 4px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:3px 0; }
  .row .lbl { font-size:12px; font-weight:500; color:#737373; }
  .row .val { font-size:12px; font-weight:500; color:#262626; text-align:right; }
  .row .val.match { color:#14b557; font-weight:700; }
  .note { font-size:11px; color:#8c8c8c; line-height:1.45; margin-top:10px; }
  .spacer { flex:1 1 auto; min-height:6px; }
  .preview-lbl { font-size:10px; font-weight:700; color:#666; margin:12px 0 6px; }
  .preview {
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center;
    background:#fff; border:1px solid #d9d9d9; border-radius:8px; padding:16px; min-height:120px;
  }
  .ph { display:flex; flex-direction:column; gap:4px; align-items:center; background:#fff; border:1px solid #d9d9d9; border-radius:8px; padding:12px; font-size:12px; font-weight:500; color:#1a1a1a; }
</style>
</head>
<body>
  <div class="container" id="cmp"></div>
<script>
const data = {
  "containerName": "Comparison: Button_mob vs MD3 vs iOS",
  "columns": [
    { "title": "Button_mob", "subtitle": "Your current component", "links": [],
      "sections": [
        { "title": "Size", "rows": [
          { "label": "Width × Height", "value": "138 × 44 px", "match": false },
          { "label": "Sizing", "value": "HUG width, HUG height", "match": false } ],
          "note": "Высота 44px точно = iOS 44pt и верхняя граница Apple touch-стандарта. Хорошо для мобилы." },
        { "title": "Corner radius", "rows": [
          { "label": "Radius", "value": "8 px", "match": false } ],
          "note": "MD3 — 20dp (pill), у нас 8px. iOS — 14pt (capsule). Наш 8px — самый скруглённый?" },
        { "title": "Padding", "rows": [
          { "label": "Horizontal", "value": "16 px", "match": false },
          { "label": "Vertical", "value": "12 px", "match": false } ],
          "note": "16/12 при высоте 44px даёт touch-area. Иконки 20px в слоте 28px — велики для 44px." },
        { "title": "Typography", "rows": [
          { "label": "Font / size", "value": "16px / weight 500", "match": false } ],
          "note": "16px — системный минимум. Weight 500 — средний между MD3 (500) и iOS (600)." },
        { "title": "Icon", "rows": [
          { "label": "Size", "value": "20 × 20 px", "match": false },
          { "label": "Vector", "value": "12 × 12 px", "match": false } ],
          "note": "Иконка 20px, вектор 12×12. Расхождение вектора (как в Input Timepicker)." },
        { "title": "Background", "rows": [
          { "label": "Fill", "value": "#448AFF (accent)", "match": false } ],
          "note": "Accent-filled. Контраст белого текста на #448AFF — проверить по WCAG." } ],
      "previewItems": [] },
    { "title": "Material Design 3", "subtitle": "Material Design 3",
      "links": [ { "text": "m3.material.io", "url": "https://m3.material.io/components/buttons/overview" } ],
      "sections": [
        { "title": "Size", "rows": [
          { "label": "Width × Height", "value": "flex × 40 dp", "match": false },
          { "label": "Sizing", "value": "HUG", "match": false } ],
          "note": "MD3 стандарт 40dp высота. Наш 44px чуть выше — на мобиле допустимо." },
        { "title": "Corner radius", "rows": [
          { "label": "Radius", "value": "20 dp (pill)", "match": false } ],
          "note": "MD3 filled = pill (20dp = full). С 8px до 20px — принципиально другой вид." },
        { "title": "Padding", "rows": [
          { "label": "Horizontal", "value": "24 dp", "match": false },
          { "label": "Vertical", "value": "~10 dp", "match": false } ],
          "note": "MD3 24dp горизонтальный — больше нашего 16px. Но с pill-радиусом." },
        { "title": "Typography", "rows": [
          { "label": "Font / size", "value": "Label-Large 14 sp / 500", "match": false } ],
          "note": "MD3 label 14sp/500. У нас 16px/500 — крупнее." },
        { "title": "Icon", "rows": [
          { "label": "Size", "value": "18 dp", "match": false } ],
          "note": "MD3 иконка 18dp. У нас 20px — чуть крупнее." },
        { "title": "Background", "rows": [
          { "label": "Fill", "value": "Primary color", "match": false } ],
          "note": "MD3 filled = primary. Наш accent #448AFF выполняет роль primary." } ],
      "previewItems": [] },
    { "title": "Apple HIG (iOS)", "subtitle": "Apple Human Interface Guidelines",
      "links": [ { "text": "developer.apple.com", "url": "https://developer.apple.com/design/human-interface-guidelines/buttons" } ],
      "sections": [
        { "title": "Size", "rows": [
          { "label": "Width × Height", "value": "flex × 44 pt", "match": true } ],
          "note": "СОВПАДЕНИЕ: 44px ≈ 44pt — наш Button_mob идеально в системный iOS touch target." },
        { "title": "Corner radius", "rows": [
          { "label": "Radius", "value": "14 pt (capsule)", "match": false } ],
          "note": "iOS ~14pt. Наш 8px меньше." },
        { "title": "Padding", "rows": [
          { "label": "Horizontal", "value": "~16 pt", "match": true },
          { "label": "Vertical", "value": "balanced", "match": false } ],
          "note": "16pt горизонтальный совпадает с нашим 16px. Вертикальный зависит от контента." },
        { "title": "Typography", "rows": [
          { "label": "Font / size", "value": "Body 17 pt / 600", "match": false } ],
          "note": "iOS 17pt/600. У нас 16/500 — ближе к системному, чем MD3." },
        { "title": "Icon", "rows": [
          { "label": "Size", "value": "24 pt", "match": false } ],
          "note": "iOS 24pt иконка, у нас 20px." },
        { "title": "Background", "rows": [
          { "label": "Fill", "value": "System (tinted)", "match": false } ],
          "note": "iOS использует tinted/системные стили. Наш accent — кастомная роль." } ],
      "previewItems": [] } ]
};

function colHTML(c){
  let h = `<div class="col">`;
  h += `<div class="col-title">${c.title}</div><div class="col-sub">${c.subtitle}</div>`;
  h += c.links.length ? `<div class="links">${c.links.map(l=>`<a href="${l.url}">${l.text}</a>`).join("  ·  ")}</div>`
                      : `<div class="linkback">&nbsp;</div>`;
  for(const s of c.sections){
    h += `<div class="divider"></div>`;
    h += `<div class="sec">${s.title}</div>`;
    for(const r of s.rows){
      h += `<div class="row"><span class="lbl">${r.label}</span><span class="val ${r.match?'match':''}">${r.value}</span></div>`;
    }
    if(s.note) h += `<div class="note">${s.note}</div>`;
  }
  h += `<div class="divider"></div><div class="spacer"></div>`;
  h += `<div class="preview-lbl">Preview</div><div class="preview">`;
  // копия нашего компонента — заглушка
  h += `<div class="ph">Button_mob</div>`;
  h += `</div></div>`;
  return h;
}
document.getElementById('cmp').innerHTML = data.columns.map(colHTML).join('');
</script>
</body>
</html>
