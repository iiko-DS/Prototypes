<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>iiko DS — прототипы</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  Страница-меню прототипов (обвязка ревью).

  Сверху — компактная полоса 48 px: название, меню страниц (кнопки-вкладки; у страницы
  с подстраницами — кнопка-селект «Название ▾»: стрелка ВНУТРИ кнопки, клик по названию
  открывает страницу, клик по стрелке — выпадающее меню подпунктов), справа —
  «Открыть в новой вкладке». Полоса сверху, а не слева, специально:
  кадры широкие (до 1440), колонка слева отнимала бы ширину.
  Ниже — живой прототип в iframe, как есть: со своей панелью «Ширина макета»,
  ручкой перетаскивания, подложками устройств и всем интерактивом.

  Добавить страницу — одна строка в PAGES (file + подпись), больше ничего;
  подстраница — `sub: true` (отдельной кнопкой в бар не выводится: становится пунктом
  выпадающего меню «▾» у предыдущей страницы — напр. «Прайс-лист» у «Поставщиков»).
  Выбор страницы живёт в адресе (#имя-файла): перезагрузка/F5 возвращает на неё.
  Полезные параметры страниц: ?w=<px> — стартовая ширина, ?ui=0 — чистый кадр 1:1.

  Стили — только токены ДС (tokens.css); компоненты не нужны, панель — обвязка.
-->
<link rel="stylesheet" href="../iiko-ds-web/font.css">
<link rel="stylesheet" href="../iiko-ds-web/tokens.css">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;flex-direction:column;background:#fff;
       font-family:Roboto,'Segoe UI',Arial,sans-serif;
       font-size:var(--ds-typography-font-size-3-5x);color:var(--ds-color-text-primary)}

  .hub-bar{flex:0 0 auto;display:flex;align-items:center;gap:16px;height:48px;padding:0 16px;
           border-bottom:1px solid var(--ds-color-stroke-default);background:#fff}
  .hub-bar__title{font-weight:var(--ds-typography-font-weight-medium);white-space:nowrap}
  .hub-tabs{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
  .hub-tabs::-webkit-scrollbar{display:none}
  .hub-tab{height:28px;padding:0 12px;border:1px solid var(--ds-color-stroke-default);
           border-radius:var(--ds-radius-2x);background:transparent;font-family:inherit;
           font-size:inherit;font-weight:var(--ds-typography-font-weight-medium);
           color:var(--ds-color-text-primary);cursor:pointer;white-space:nowrap}
  .hub-tab:hover{background:var(--ds-color-button-neutral-hover)}
  .hub-tab.is-active{border-color:var(--ds-color-brand-accent-default);
                     background:var(--ds-color-brand-accent-default);color:var(--ds-color-text-inversive)}
  /* Страница с подстраницами: ОДНА кнопка-селект «Название ▾» — стрелка ВНУТРИ кнопки
     (не отдельный элемент): клик по названию открывает страницу, клик по стрелке — меню */
  .hub-group{position:relative;display:flex;align-items:center}
  .hub-tab--menu{padding-right:8px}
  .hub-tab__caret{display:inline-block;margin-left:6px;width:14px;font-size:12px;line-height:1;
                  text-align:center;opacity:.7;transform:translateY(1px)}
  .hub-tab--menu:hover .hub-tab__caret{opacity:1}
  .hub-tab--menu.is-open{border-color:var(--ds-color-brand-accent-default)}
  .hub-tab--menu.is-open .hub-tab__caret,
  .hub-tab--menu.is-sub-active .hub-tab__caret{color:var(--ds-color-text-accent);opacity:1}
  /* Меню подпунктов — fixed: не режется прокруткой вкладок (.hub-tabs overflow-x);
     тень — токен ДС Shadows/S/1 */
  .hub-menu{position:fixed;z-index:20;min-width:200px;display:none;padding:4px;
            border:1px solid var(--ds-color-stroke-default);border-radius:var(--ds-radius-2x);background:#fff;
            box-shadow:var(--ds-shadow-shadows-s-1-x) var(--ds-shadow-shadows-s-1-y) var(--ds-shadow-shadows-s-1-blur) var(--ds-shadow-shadows-s-1-spread) var(--ds-shadow-shadows-s-1-color)}
  .hub-menu.is-open{display:block}
  .hub-menu__item{display:block;width:100%;padding:6px 10px;border:0;border-radius:var(--ds-radius-2x);background:transparent;
                  font-family:inherit;font-size:inherit;color:var(--ds-color-text-primary);text-align:left;
                  white-space:nowrap;cursor:pointer}
  .hub-menu__item:hover{background:var(--ds-color-button-neutral-hover)}
  .hub-menu__item.is-current{color:var(--ds-color-text-accent);font-weight:var(--ds-typography-font-weight-medium)}
  .hub-bar__open{margin-left:auto;color:var(--ds-color-text-secondary);text-decoration:none;white-space:nowrap}
  .hub-bar__open:hover{color:var(--ds-color-text-accent)}

  /* Узкое окно — меню не терять: прячем название и подпись «Открыть» */
  @media (max-width:860px){.hub-bar__title{display:none}}
  @media (max-width:640px){.hub-bar{gap:8px}.hub-bar__open-label{display:none}}

  .hub-view{flex:1;min-height:0}
  .hub-view iframe{display:block;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
  <header class="hub-bar">
    <span class="hub-bar__title">iiko DS · прототипы</span>
    <nav class="hub-tabs" id="tabs" aria-label="Страницы прототипов"></nav>
    <a class="hub-bar__open" id="open" href="#" target="_blank" rel="noopener" title="Открыть в новой вкладке"><span class="hub-bar__open-label">Открыть в новой вкладке</span> ↗</a>
  </header>
  <main class="hub-view"><iframe id="frame" title="Прототип"></iframe></main>

  <script>
    // Новая страница — одна строка: кнопка и вывод появятся сами; подстраница — sub: true
    var PAGES = [
      { file: 'figma-1276-metro-desktop.html', title: 'Метро · 1. Общие настройки' },
      { file: 'figma-1277-metro-step2.html',   title: 'Метро · 2. Создание заказа' },
      { file: 'figma-7422-suppliers.html',     title: 'Поставщики' },
      { file: 'figma-7431-pricelist.html',     title: 'Прайс-лист', sub: true },
      { file: 'figma-7436-pricelist-edit.html', title: 'Прайс-лист — редактирование', sub: true },
      { file: 'figma-7450-create-product.html', title: 'Создать продукт — панель (без шапки и меню)', sub: true }
    ];

    var tabs = document.getElementById('tabs');
    var frame = document.getElementById('frame');
    var open = document.getElementById('open');

    function closeMenus() {
      Array.prototype.forEach.call(tabs.querySelectorAll('.hub-menu.is-open'), function (m) { m.classList.remove('is-open'); });
      Array.prototype.forEach.call(tabs.querySelectorAll('.hub-tab--menu.is-open'), function (b) { b.classList.remove('is-open'); });
    }

    function show(i) {
      var p = PAGES[i];
      if (!p) return;
      if (frame.getAttribute('src') !== p.file) frame.src = p.file;   // повторный выбор не перезагружает
      open.href = p.file;
      Array.prototype.forEach.call(tabs.querySelectorAll('.hub-tab'), function (b) {
        b.classList.toggle('is-active', Number(b.dataset.page) === i);
      });
      // стрелка кнопки-селекта подсвечивается, когда открыта страница из её меню;
      // текущий пункт меню — акцентом
      Array.prototype.forEach.call(tabs.querySelectorAll('.hub-tab--menu'), function (b) {
        var mine = Array.prototype.some.call(b.parentNode.querySelectorAll('.hub-menu__item'), function (it) {
          return Number(it.dataset.page) === i;
        });
        b.classList.toggle('is-sub-active', mine);
      });
      Array.prototype.forEach.call(tabs.querySelectorAll('.hub-menu__item'), function (it) {
        it.classList.toggle('is-current', Number(it.dataset.page) === i);
      });
      try { history.replaceState(null, '', '#' + p.file); } catch (err) {}
    }

    // Меню: страница — кнопка; подстраницы (sub: true) — в выпадающем меню «▾» у родителя
    (function buildMenu() {
      var groups = [];
      PAGES.forEach(function (p, i) {
        if (p.sub && groups.length) { groups[groups.length - 1].subs.push(i); return; }
        groups.push({ parent: i, subs: [] });
      });
      groups.forEach(function (g) {
        var parent = PAGES[g.parent];

        // Кнопка-селект: у страницы с подстраницами стрелка «▾» — ВНУТРИ кнопки
        var tab = document.createElement('button');
        tab.type = 'button';
        tab.className = g.subs.length ? 'hub-tab hub-tab--menu' : 'hub-tab';
        tab.dataset.page = g.parent;
        tab.title = parent.file;
        if (g.subs.length) tab.setAttribute('aria-haspopup', 'true');

        var label = document.createElement('span');
        label.className = 'hub-tab__label';
        label.textContent = parent.title;
        tab.appendChild(label);

        var caret = null;
        if (g.subs.length) {
          caret = document.createElement('span');
          caret.className = 'hub-tab__caret';
          caret.textContent = '▾';
          caret.title = 'Подстраницы';
          tab.appendChild(caret);
        }

        // клик по названию — открывает страницу
        tab.addEventListener('click', function () { closeMenus(); show(g.parent); });

        if (!g.subs.length) { tabs.appendChild(tab); return; }

        var menu = document.createElement('div');
        menu.className = 'hub-menu';
        g.subs.forEach(function (ci) {
          var item = document.createElement('button');
          item.type = 'button';
          item.className = 'hub-menu__item';
          item.dataset.page = ci;
          item.textContent = PAGES[ci].title;
          item.addEventListener('click', function () { closeMenus(); show(ci); });
          menu.appendChild(item);
        });

        // клик по стрелке (внутри кнопки) — меню подпунктов; само меню — вне кнопки
        // (вложенные кнопки недопустимы): обёртка .hub-group, меню fixed — не режется overflow вкладок
        caret.addEventListener('click', function (e) {
          e.stopPropagation();
          var willOpen = !menu.classList.contains('is-open');
          closeMenus();
          if (!willOpen) return;
          var r = tab.getBoundingClientRect();
          menu.style.top = Math.round(r.bottom + 6) + 'px';
          var mw = menu.offsetWidth || 200;
          var left = Math.round(r.left);
          if (left + mw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - mw - 8);
          menu.style.left = left + 'px';
          menu.classList.add('is-open');
          tab.classList.add('is-open');
        });

        var wrap = document.createElement('div');
        wrap.className = 'hub-group';
        wrap.appendChild(tab);
        wrap.appendChild(menu);
        tabs.appendChild(wrap);
      });

      // закрытие меню: клик вне, Escape, прокрутка вкладок, изменение размера окна
      document.addEventListener('click', function (e) { if (!tabs.contains(e.target)) closeMenus(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenus(); });
      tabs.addEventListener('scroll', closeMenus);
      window.addEventListener('resize', closeMenus);
    })();

    var start = 0, hash = (location.hash || '').slice(1);
    PAGES.forEach(function (p, i) { if (hash && (p.file === hash || String(i + 1) === hash)) start = i; });
    show(start);
  </script>
</body>
</html>
