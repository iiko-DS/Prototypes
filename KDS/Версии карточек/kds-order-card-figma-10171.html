<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заказ: время просрочено — из Figma (KDS-карточка)</title>
<!-- ДС: токены + стили компонентов (по URL сайта ДС) -->
<link rel="stylesheet" href="https://anders7rusk.github.io/iiko-ds-web/tokens.css">
<link rel="stylesheet" href="https://anders7rusk.github.io/iiko-ds-web/components/index.css">
<!-- Roboto из Google Fonts -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<!-- Иконки Material Icons -->
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
<style>
  .material-icons{font-family:'Material Icons Outlined'}
  *,*::before,*::after{box-sizing:border-box}

  /* каркас страницы (как у остальных файлов вариантов) */
  html,body{margin:0;min-height:100%;background:#f4f5f7;font-family:'Roboto','Helvetica Neue',Arial,sans-serif}
  body{display:flex;align-items:flex-start;justify-content:center;min-height:100vh;padding:24px;box-sizing:border-box}
  .layout{width:362px;max-width:calc(100vw - 32px)}

  /* ═══ КАРТОЧКА ИЗ FIGMA: «Заказ: готовится_время просрочено» (узел 10171:4757) ═══
     Отрисовка один-в-один по макету: карточка 362 × 509 (замеры — по выгрузке макета 17.09).
     Палитра макета: фон карточки #1a1a24, шапка #3b3b43 (рамка 1 px #333), строки блюд #2a2a33
     с синей полосой 2 px справа (#448aff), кнопки #3b3b43 (стрелка #9e9e9e, удаление #ff5252),
     комментарий — штриховая линия слева (#ffab40). Состояние статичное — как в макете. */
  .kcard{display:flex;flex-direction:column;gap:2px;width:362px;max-width:100%;padding:2px 0;background:#1a1a24;color:#fff;border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.45)}

  /* шапка: верх 8/8/4 + футер 8 (зазор 4), рамка 1 px */
  .kcard__head{display:flex;flex-direction:column;padding:0 2px;background:#3b3b43;border:1px solid #333;border-radius:8px;overflow:hidden}
  .kcard__top{display:flex;flex-direction:column;padding:8px 8px 4px}
  .kcard__r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .kcard__num,.kcard__time{font-size:24px;font-weight:500;line-height:32px;letter-spacing:.5px;white-space:nowrap}
  .kcard__channel{font-size:14px;line-height:20px}
  .kcard__foot{display:flex;flex-direction:column;gap:4px;padding:0 8px 8px}
  .kcard__row{display:flex;align-items:center;gap:4px;min-width:0;font-size:14px;line-height:20px}
  .kcard__row .material-icons{font-size:20px;flex:0 0 auto}
  .kcard__row--customer{min-height:24px}
  .kcard__row--meta{gap:16px}
  .kcard__m{display:flex;align-items:center;gap:4px;white-space:nowrap}
  .kcard__pay{margin-left:auto}
  .kcard__div{height:1px;background:#333}
  .kcard__comment{padding:0 8px}
  .kcard__comment-in{display:flex;align-items:center;border-left:2px dashed #ffab40;padding:2px 12px;font-size:14px;line-height:20px;color:#d6d6d6}

  /* контент: «коробки» 56 px с зазором 2, кнопка 54 × 54 справа */
  .kcard__body{display:flex;flex-direction:column;gap:2px;padding:0 2px}
  .kdish{display:flex;align-items:center;height:56px;padding-right:2px;background:#2a2a33;border-right:2px solid #448aff;border-radius:8px}
  .kdish__text{flex:1;min-width:0;display:flex;align-items:center;gap:4px;padding:0 12px}
  .kdish__qty,.kdish__name{font-size:20px;font-weight:500;line-height:28px;letter-spacing:.5px}
  /* название не сжимаем и не обрезаем: в макете длинное название выходит в правый паддинг без многоточия */
  .kdish__name{flex:0 0 auto;white-space:nowrap}
  .kdish__name--error{color:#ff5252}
  .kdish__qty--error{color:#ff5252}
  .kdish__act{flex:0 0 54px;width:54px;height:54px;margin:0;padding:0;border:0;border-radius:8px;background:#3b3b43;color:#9e9e9e;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
  .kdish__act .material-icons{font-size:28px}
  .kdish__act--negative{color:#ff5252}

  /* группа: заголовок 56 + добавки 18/24, кнопка удаления 54 × 228 (низ — с отступом 4) */
  .kdish--group{align-items:flex-start;height:auto;padding-bottom:4px}
  .kdish__col{flex:1;min-width:0}
  .kdish--group .kdish__text{height:56px;padding:8px 12px}
  .kgroup__mods{display:flex;flex-direction:column}
  .kgroup__mod{display:flex;align-items:center;gap:4px;padding:2px 8px 2px 28px;font-size:18px;line-height:24px;letter-spacing:.5px;color:#ff5252}
  /* «1» в добавках — 18/24 Regular, как в макете (не стиль строки блюда) */
  .kgroup__mod .kdish__qty{font-size:18px;font-weight:400;line-height:24px}
  .kdish__act--tall{height:228px}
</style>
</head>
<body>
<div class="layout">

  <!-- KDS-карточка по макету: заказ 1028, «готовится», время просрочено -->
  <article class="kcard">
    <div class="kcard__head">
      <div class="kcard__top">
        <div class="kcard__r1">
          <span class="kcard__num">1028</span>
          <span class="kcard__time">12:35</span>
        </div>
        <div class="kcard__channel">#9753 Яндекс доставка</div>
      </div>
      <div class="kcard__foot">
        <div class="kcard__row kcard__row--customer">
          <span class="material-icons">person_outline</span><span>Константинопольский</span>
        </div>
        <div class="kcard__row kcard__row--meta">
          <span class="kcard__m"><span class="material-icons">restaurant</span>Обычный заказ</span>
          <span class="kcard__m"><span class="material-icons">table_bar</span>Б12</span>
          <span class="kcard__m"><span class="material-icons">group</span>3</span>
          <span class="material-icons kcard__pay">credit_card</span>
        </div>
        <div class="kcard__div"></div>
        <div class="kcard__comment">
          <div class="kcard__comment-in">Принести сразу морс</div>
        </div>
      </div>
    </div>
    <div class="kcard__body">
      <div class="kdish">
        <div class="kdish__text"><span class="kdish__qty">1</span><span class="kdish__name">Морс ягодный 1 л.</span></div>
        <button class="kdish__act" type="button" aria-label="Перевести блюдо в следующий статус"><span class="material-icons">arrow_forward</span></button>
      </div>
      <div class="kdish">
        <div class="kdish__text"><span class="kdish__qty">1</span><span class="kdish__name">Паста карбонара</span></div>
        <button class="kdish__act" type="button" aria-label="Перевести блюдо в следующий статус"><span class="material-icons">arrow_forward</span></button>
      </div>
      <div class="kdish kdish--group">
        <div class="kdish__col">
          <div class="kdish__text"><span class="kdish__qty kdish__qty--error">1</span><span class="kdish__name kdish__name--error">Пицца от шефа маленькая</span></div>
          <div class="kgroup__mods">
            <div class="kgroup__mod"><span class="kdish__qty">1</span><span>Двойной сыр</span></div>
            <div class="kgroup__mod"><span class="kdish__qty">1</span><span>Толстое</span></div>
            <div class="kgroup__mod"><span class="kdish__qty">1</span><span>Бекон</span></div>
            <div class="kgroup__mod"><span class="kdish__qty">1</span><span>Курица</span></div>
            <div class="kgroup__mod"><span class="kdish__qty">1</span><span>Пепперони</span></div>
            <div class="kgroup__mod"><span class="kdish__qty">1</span><span>Салями</span></div>
          </div>
        </div>
        <button class="kdish__act kdish__act--negative kdish__act--tall" type="button" aria-label="Удалить блюдо"><span class="material-icons">delete</span></button>
      </div>
    </div>
  </article>

</div>
</body>
</html>
